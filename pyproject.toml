[project]
name = "contoso-data-product-snowflake-airflow3"
version = "0.1.0"
description = "The Contoso data product for Snowflake under Airflow 3: vendor ingests, a COPY INTO bronze, and the dbt profiles cosmos renders."
requires-python = ">=3.12"
authors = [{name = "Calvin Cheng", email = "calvin@calvinx.com"}]

# WHAT THE WORKER MUST IMPORT. The platform builds its image with
# `uv pip install /opt/build`, which installs THIS list and this package. There
# is no requirements.txt anywhere.
#
# DELIBERATELY NOT HERE: dbt. `dbt-snowflake` pins `snowflake-connector-python`
# back below what ingest and bronze need, and cosmos builds dbt its own
# virtualenv per task anyway. Putting dbt in the worker would mean one of the
# two silently winning.
dependencies = [
    # THE PRODUCT, BY TAG. Not a path: a leaf that resolves core from a sibling
    # checkout cannot be cloned on its own, which is DoD item 1 in the family
    # plan.
    "contoso-data-product",
    # The emulator-or-real switch, published by snowflake-emulator's release.
    "snowflake-target",
    "snowflake-connector-python>=4.7.2",
    "requests>=2.32,<3",
    # THE ERP VENDOR IS A CHANGE STREAM, so a Kafka client is the only way to
    # consume it. Reading erp.customer directly would be a snapshot, and a
    # snapshot cannot say that a customer was in Germany before they were in
    # France -- which is the entire reason this vendor exists.
    "confluent-kafka>=2.5,<3",
    # Not to ingest with: the CDC step reconciles the stream's net effect
    # against the ERP's own row count, because a connector that stopped early
    # produces a stream that is stable, well-formed and short.
    "psycopg[binary]>=3.2,<4",
    # The reference vendor ships Parquet. This engine's COPY INTO accepts
    # TYPE = PARQUET, reports ok and loads nothing (snowflake-emulator#20), so
    # the parts are rewritten as CSV on the way into the stage.
    "pyarrow>=18,<24",
    # Renders a dbt project as Airflow tasks with dbt's own graph as the
    # dependencies -- which is what puts silver and gold in the UI as real
    # edges and lets one model retry alone.
    "astronomer-cosmos>=1.15,<2",
]

[dependency-groups]
# For `scripts/manifest.py` and for running dbt by hand. NOT installed in the
# worker: cosmos builds the task virtualenv from `DBT_REQUIREMENTS` in the DAG,
# and those two lists are kept equal deliberately.
dbt = ["dbt-core>=1.9,<2", "dbt-snowflake>=1.8,<2"]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contoso_sf_airflow"]

[tool.uv]
# THIRTEEN ADVISORIES, AND NONE HAS A RELEASE TO UPGRADE INTO.
#
# cryptography, pyopenssl and sqlparse all arrive through dbt-snowflake, which
# pins an older snowflake-connector-python, which caps the first two. A
# constraint cannot fix that -- narrowing cannot satisfy `<0.6.0` and `>=0.6.0`
# at once -- so the upper bounds are overridden, exactly as
# `contoso-data-product-snowflake-tasks` does.
#
# It also does a second job here: without the connector override, dbt's pin and
# this product's own dependency on the connector are unsatisfiable together, and
# the two would have to be declared CONFLICTING groups -- which would mean
# neither was installed in the worker, because the worker installs
# `[project] dependencies` and no group at all.
#
# DELETE THESE when dbt-snowflake takes a connector that allows the patched
# versions, rather than leaving them quietly pinning the ecosystem.
override-dependencies = [
    "cryptography>=50.0.0",
    "pyopenssl>=26.0.0",
    "sqlparse>=0.6.0",
    "snowflake-connector-python>=4.7.2",
]

[tool.uv.sources]
# PUBLISHED WHEELS, not sibling checkouts, and at the SAME TAGS the Tasks cell
# pins. That equality is the point of this cell: same product, same engine, same
# pins, different orchestrator. If the numbers differ, the orchestrator is the
# only remaining candidate.
#
# The snowflake-target tag must equal SNOWFLAKE_EMULATOR_VERSION in the
# platform's versions.env; `scripts/check_product_pin.py` there refuses to run
# when they disagree.
contoso-data-product = { url = "https://github.com/calvinchengx/contoso-data-product/releases/download/v0.3.1/contoso_data_product-0.3.1-py3-none-any.whl" }
snowflake-target = { url = "https://github.com/calvinchengx/snowflake-emulator/releases/download/v0.1.6/snowflake_target-0.1.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
